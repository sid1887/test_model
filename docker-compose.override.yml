services:
  web:
    volumes:
      - ./universal_package_installer.py:/app/universal_package_installer.py
    environment:
      - SECRET_KEY=production-secret-key-2025-secure
      - ENVIRONMENT=development
    command: >
      bash -c "
      echo 'Starting web service with package installer...' &&
      python /app/universal_package_installer.py --individual-packages &&
      echo 'Package installation completed. Starting FastAPI...' &&
      exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
